<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人计划表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        /* 动物之森小岛风 · animal-island-ui (animal crossing) */
        --bg: #f8f8f0; /* warm island sand */
        --bg-2: #f0e8d8;
        --panel: #fffefa;
        --ink: #794f27; /* warm wood brown */
        --ink-strong: #5e3d1d;
        --muted: #9f927d;
        --line: #e8e2d6; /* light wood edge */
        --line-strong: #aaa69d;
        --soft: #f3efe3;
        --accent: #19c8b9; /* lagoon teal */
        --accent-ink: #0e9183;
        --accent-soft: #e6f9f6;
        --accent-press: #129a8e; /* 3d button under-shadow */
        --leaf: #6fba2c; /* leaf green (complete) */
        --leaf-ink: #4f8a1e;
        --leaf-soft: #eef7e2;
        --leaf-press: #5a9e1e;
        --sun: #f5c31c; /* sun yellow (medium priority) */
        --sun-ink: #a9810a;
        --sun-soft: #fdf3d3;
        --berry: #e05a5a; /* berry red (danger / high) */
        --berry-ink: #c94444;
        --berry-soft: #fbe5e5;
        --berry-press: #c94444;
        --wood-press: #bdaea0; /* neutral 3d under-shadow */
        --urgent: #e05a5a;
        --important: #19c8b9;
        --shadow: 0 8px 24px 0 rgba(61, 52, 40, 0.14);
        --shadow-soft: 0 3px 10px 0 rgba(61, 52, 40, 0.1);
        --radius: 18px;
        --radius-lg: 24px;
        --radius-pill: 50px;
        /* semantic aliases reused across the sheet */
        --mint: var(--accent);
        --mint-ink: var(--accent-ink);
        --mint-soft: var(--accent-soft);
        --butter: var(--sun);
        --butter-ink: var(--sun-ink);
        --butter-soft: var(--sun-soft);
        --danger: var(--berry);
        --danger-ink: var(--berry-ink);
        --danger-soft: var(--berry-soft);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }

      input[type="text"],
      input[type="password"],
      input[type="date"],
      input[type="file"],
      textarea {
        cursor: text;
      }
      html,
      body {
        width: 100%;
        min-width: 0;
        background:
          radial-gradient(circle at 12% -8%, #e6f9f6 0, transparent 46%),
          radial-gradient(circle at 92% 4%, #eef7e2 0, transparent 42%),
          var(--bg);
        background-attachment: fixed;
      }
      body {
        margin: 0;
        color: var(--ink);
        font: 14px/1.5715 "Nunito", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.02em;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        border: 2px solid transparent;
        border-radius: var(--radius-pill);
        height: 36px;
        padding: 0 16px;
        font-weight: 700;
        font-family: inherit;
        letter-spacing: 0.02em;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      }
      /* Animal-island 3D press: solid offset shadow, compresses on click */
      button:active {
        transform: translateY(3px);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 5px 0 0 var(--accent-press);
      }
      .primary:hover {
        background: #2ad3c4;
      }
      .primary:active {
        box-shadow: 0 2px 0 0 var(--accent-press);
      }
      .secondary {
        background: var(--panel);
        color: var(--accent-ink);
        border-color: var(--accent);
        box-shadow: 0 5px 0 0 #bfe9e3;
      }
      .secondary:hover {
        background: var(--accent-soft);
      }
      .secondary:active {
        box-shadow: 0 2px 0 0 #bfe9e3;
      }
      .ghost {
        background: var(--panel);
        border-color: var(--line-strong);
        color: var(--ink);
        box-shadow: 0 5px 0 0 var(--wood-press);
      }
      .ghost:hover {
        background: var(--soft);
        border-color: var(--ink);
      }
      .ghost:active {
        box-shadow: 0 2px 0 0 var(--wood-press);
      }
      .danger {
        background: var(--berry);
        border-color: var(--berry);
        color: #fff;
        box-shadow: 0 5px 0 0 var(--berry-press);
      }
      .danger:hover {
        background: #e87070;
      }
      .danger:active {
        box-shadow: 0 2px 0 0 var(--berry-press);
      }
      .complete {
        background: var(--leaf);
        border-color: var(--leaf);
        color: #fff;
        box-shadow: 0 5px 0 0 var(--leaf-press);
      }
      .complete:hover {
        background: #7cc83a;
      }
      .complete:active {
        box-shadow: 0 2px 0 0 var(--leaf-press);
      }
      .auth-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .auth-card {
        width: min(380px, 100%);
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: 30px 26px 26px;
        text-align: center;
        position: relative;
      }
      .auth-card .mascot {
        margin: 0 auto 8px;
      }
      .auth-card h1 {
        margin-bottom: 6px;
        font-family: "Baloo 2", "PingFang SC", sans-serif;
        color: var(--accent-ink);
      }
      .auth-card input {
        width: 100%;
        height: 42px;
        border: 2px solid var(--line);
        border-radius: var(--radius-pill);
        margin-top: 16px;
        padding: 0 16px;
        background: var(--soft);
      }
      .auth-card input:focus {
        outline: none;
        border-color: var(--accent);
        background: #fff;
      }
      .auth-card button {
        width: 100%;
        margin-top: 12px;
        height: 42px;
      }
      .shell {
        width: 100%;
        min-width: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 22px;
        background: rgba(255, 254, 250, 0.82);
        border-bottom: 2px dashed var(--line);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        letter-spacing: 0.2px;
        font-family: "Baloo 2", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--accent-ink);
      }
      .sub {
        color: var(--accent-ink);
        margin-left: 10px;
        font-size: 13px;
        font-family: "Nunito", "Noto Sans SC", sans-serif;
        font-weight: 700;
      }
      /* === 签名吉物：动森小狗 villager-pup mascot (pure CSS) ===
         span 复用：ear×2=耷拉的狗耳, body=圆脸, eye×2=大眼,
         cheek×2=腮红, mouth=狗鼻+嘴 */
      .mascot {
        position: relative;
        width: 46px;
        height: 42px;
        flex: 0 0 auto;
        transition: transform 0.2s ease;
        transform-origin: 50% 90%;
      }
      .mascot:hover {
        animation: mascot-bounce 0.6s ease;
      }
      /* 圆脸 */
      .mascot .body {
        position: absolute;
        left: 7px;
        right: 7px;
        top: 4px;
        bottom: 0;
        background: #fdf6e9;
        border: 2.5px solid var(--ink);
        border-radius: 50% 50% 48% 48% / 52% 52% 50% 50%;
        z-index: 1;
      }
      /* 耷拉的狗耳 */
      .mascot .ear {
        position: absolute;
        top: 2px;
        width: 13px;
        height: 20px;
        background: var(--ink);
        border-radius: 50% 50% 45% 45% / 40% 40% 60% 60%;
        transition: transform 0.25s ease;
        z-index: 0;
      }
      .mascot .ear.l {
        left: 0;
        transform: rotate(10deg);
        transform-origin: top center;
      }
      .mascot .ear.r {
        right: 0;
        transform: rotate(-10deg);
        transform-origin: top center;
      }
      .mascot:hover .ear.l {
        transform: rotate(22deg);
      }
      .mascot:hover .ear.r {
        transform: rotate(-22deg);
      }
      /* 腮红 */
      .mascot .cheek {
        position: absolute;
        top: 24px;
        width: 7px;
        height: 5px;
        border-radius: 50%;
        background: var(--berry);
        opacity: 0.5;
        z-index: 2;
      }
      .mascot .cheek.l {
        left: 9px;
      }
      .mascot .cheek.r {
        right: 9px;
      }
      .mascot:hover .cheek {
        opacity: 0.8;
      }
      /* 大眼 */
      .mascot .eye {
        position: absolute;
        top: 16px;
        width: 5px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-strong);
        transform-origin: center;
        z-index: 2;
      }
      .mascot:hover .eye {
        animation: mascot-blink 0.6s ease;
      }
      .mascot .eye.l {
        left: 15px;
      }
      .mascot .eye.r {
        right: 15px;
      }
      /* 狗鼻 + 嘴 */
      .mascot .mouth {
        position: absolute;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 5px;
        height: 4px;
        background: var(--ink-strong);
        border-radius: 50%;
        z-index: 2;
      }
      .mascot .mouth::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 8px;
        height: 5px;
        border: 1.6px solid var(--ink-strong);
        border-top: 0;
        border-radius: 0 0 7px 7px;
      }
      @keyframes mascot-bounce {
        0% {
          transform: translateY(0) scale(1, 1);
        }
        30% {
          transform: translateY(-5px) scale(0.95, 1.05) rotate(-3deg);
        }
        55% {
          transform: translateY(0) scale(1.06, 0.94);
        }
        75% {
          transform: translateY(-2px) scale(0.98, 1.02) rotate(2deg);
        }
        100% {
          transform: translateY(0) scale(1, 1);
        }
      }
      @keyframes mascot-blink {
        0%,
        100% {
          transform: scaleY(1);
        }
        45%,
        55% {
          transform: scaleY(0.1);
        }
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 10px clamp(320px, var(--chat-w, 27vw), 720px);
        gap: 6px;
        padding: 16px;
        width: 100%;
        min-width: 0;
      }
      /* drag handle to resize the AI assistant panel */
      .resizer {
        align-self: stretch;
        width: 10px;
        border: none;
        padding: 0;
        background: transparent;
        cursor: col-resize;
        display: grid;
        place-items: center;
        border-radius: var(--radius-pill);
        touch-action: none;
      }
      .resizer::before {
        content: "";
        width: 5px;
        height: 46px;
        border-radius: var(--radius-pill);
        background: var(--line);
        transition: background 0.15s ease, height 0.15s ease;
      }
      .resizer:hover::before,
      .resizer.dragging::before {
        background: var(--accent);
        height: 64px;
      }
      .resizer:focus-visible {
        outline: none;
      }
      .resizer:focus-visible::before {
        background: var(--accent);
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      body.resizing {
        user-select: none;
        cursor: col-resize;
      }
      .board,
      .chat {
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        min-width: 0;
      }
      /* === 动森小岛背景纹理：草皮圆点 + 叶影 island turf pattern === */
      .board {
        position: relative;
        background-color: var(--panel);
        background-image:
          radial-gradient(circle at center, rgba(25, 200, 185, 0.06) 2.5px, transparent 3px),
          radial-gradient(circle at center, rgba(111, 186, 44, 0.05) 2.5px, transparent 3px);
        background-size: 34px 34px, 34px 34px;
        background-position: 0 0, 17px 17px;
      }
      .table-wrap {
        position: relative;
        z-index: 1;
      }
      /* grass-scallop strip grounding the board bottom */
      .board-turf {
        position: relative;
        z-index: 1;
        height: 22px;
        border-radius: 0 0 calc(var(--radius) - 2px) calc(var(--radius) - 2px);
        background:
          radial-gradient(circle at 11px 22px, var(--leaf-soft) 11px, transparent 12px) 0 0 / 22px 22px repeat-x,
          linear-gradient(180deg, transparent, var(--leaf-soft));
        opacity: 0.7;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        border-bottom: 2px dashed var(--line);
      }
      .board-summary {
        font-weight: 800;
        color: var(--accent-ink);
        white-space: nowrap;
        flex: 0 0 auto;
        min-width: 92px;
        text-align: right;
      }
      .toolbar-main {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto auto auto auto;
        gap: 8px;
        width: 100%;
        align-items: center;
      }
      .filters {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filters input,
      .filters select {
        height: 34px;
        border: 1.5px solid var(--line);
        border-radius: var(--radius-pill);
        padding: 0 14px;
        background: var(--soft);
        color: var(--ink);
      }
      .filters input:focus,
      .filters select:focus {
        outline: none;
        border-color: var(--accent);
        background: #fff;
      }
      .filters input {
        min-width: 220px;
      }
      .table-wrap {
        overflow-y: auto;
        overflow-x: hidden;
        max-height: calc(100vh - 148px);
        scrollbar-gutter: stable;
      }
      .table-wrap::-webkit-scrollbar {
        width: 8px;
      }
      .table-wrap::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 999px;
      }
      .table-wrap::-webkit-scrollbar-track {
        background: transparent;
      }
      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
        min-width: 0;
      }
      th,
      td {
        border-bottom: 1.5px solid var(--line);
        padding: 9px 7px;
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }
      th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-size: 12px;
        font-weight: 800;
      }
      .sort-button {
        width: 100%;
        height: auto;
        min-height: 28px;
        padding: 0;
        background: transparent;
        color: inherit;
        border: 0;
        text-align: left;
        font-weight: 800;
      }
      .sort-button:hover {
        transform: none;
        color: var(--accent);
      }
      .sort-button::after {
        content: "↕";
        color: var(--muted);
        font-size: 11px;
        margin-left: 5px;
      }
      .sort-button.active::after {
        content: attr(data-sort-indicator);
        color: var(--accent-ink);
      }
      td input,
      td select,
      td textarea {
        width: 100%;
        min-width: 0;
        border: 1.5px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: var(--ink);
        padding: 5px 7px;
        font-size: 13px;
        line-height: 1.4;
        font-family: inherit;
      }
      td select {
        appearance: none;
        -webkit-appearance: none;
        padding-right: 20px;
        background-image: linear-gradient(45deg, transparent 50%, var(--accent-ink) 50%),
          linear-gradient(135deg, var(--accent-ink) 50%, transparent 50%);
        background-position: right 8px center, right 4px center;
        background-size: 4px 4px, 4px 4px;
        background-repeat: no-repeat;
      }
      td input[type="date"] {
        padding-right: 4px;
      }
      td input:focus,
      td select:focus,
      td textarea:focus {
        outline: none;
        background: #fff;
        border-color: var(--accent);
      }
      td textarea {
        resize: none;
        min-height: 52px;
        max-height: 132px;
        line-height: 1.4;
        overflow-y: auto;
        overflow-wrap: anywhere;
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) transparent;
      }
      td textarea::-webkit-scrollbar {
        width: 6px;
      }
      td textarea::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 999px;
      }
      tbody tr {
        transition: background 0.12s ease;
      }
      tbody tr:hover {
        background: var(--soft);
      }
      tr.priority-high td:first-child {
        box-shadow: inset 4px 0 0 var(--berry);
      }
      tr.priority-medium td:first-child {
        box-shadow: inset 4px 0 0 var(--sun);
      }
      tr.priority-low td:first-child {
        box-shadow: inset 4px 0 0 var(--leaf);
      }
      tr.done-row {
        opacity: 0.6;
      }
      tr.done-row .title-cell input {
        text-decoration: line-through;
      }
      .priority-pill,
      .quadrant-pill {

        align-items: center;
        justify-content: center;

        border-radius: var(--radius-pill);
        font-size: 12px;
        font-weight: 800;
        margin-top: 5px;
        padding: 0 11px;

        font-family: inherit;

      }
      .p-high {
        background: var(--berry-soft);
        color: var(--berry-ink);
      }
      .p-medium {
        background: var(--sun-soft);
        color: var(--sun-ink);
      }
      .p-low {
        background: var(--leaf-soft);
        color: var(--leaf-ink);
      }
      .quadrant-pill {
        background: var(--soft);
        color: var(--muted);
      }
      .q-do {
        background: var(--berry-soft);
        color: var(--berry-ink);
      }
      .q-plan {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .q-delegate {
        background: var(--sun-soft);
        color: var(--sun-ink);
      }
      .q-later {
        background: var(--leaf-soft);
        color: var(--leaf-ink);
      }
      .row-actions {
        display: flex;
        gap: 8px;
        align-items: stretch;
        flex-direction: column;
      }
      .row-actions button {
        height: 28px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 3px 0 0 var(--wood-press);
      }
      .row-actions .complete {
        box-shadow: 0 3px 0 0 var(--leaf-press);
      }
      .row-actions .danger {
        box-shadow: 0 3px 0 0 var(--berry-press);
      }
      .row-actions button:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 var(--wood-press);
      }
      .row-actions .complete:active {
        box-shadow: 0 1px 0 0 var(--leaf-press);
      }
      .row-actions .danger:active {
        box-shadow: 0 1px 0 0 var(--berry-press);
      }
      .bulkbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 2px dashed var(--line);
        background: var(--mint-soft);
      }
      .bulkbar strong {
        color: var(--mint-ink);
      }
      .select-cell {
        width: 42px;
        text-align: center;
      }
      .select-cell input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .quadrant-bar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 14px;
        border-bottom: 2px dashed var(--line);
        background: var(--soft);
      }
      .quadrant-card {
        border: 2px solid var(--line);
        border-radius: 16px;
        height: auto;
        min-height: 82px;
        padding: 13px 14px;
        background: #fff;
        display: grid;
        grid-template-columns: 6px minmax(0, 1fr);
        gap: 12px;
        align-items: stretch;
        text-align: left;
        color: inherit;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .quadrant-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-soft);
      }
      .quadrant-card.q-do {
        background: var(--berry-soft);
        border-color: #f1c9c9;
      }
      .quadrant-card.q-plan {
        background: var(--accent-soft);
        border-color: #b9e8e2;
      }
      .quadrant-card.q-delegate {
        background: var(--sun-soft);
        border-color: #f0dc9a;
      }
      .quadrant-card.q-later {
        background: var(--leaf-soft);
        border-color: #d3e8b8;
      }
      .quadrant-card.active {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .quadrant-dot {
        width: 6px;
        height: 100%;
        min-height: 52px;
        border-radius: 999px;
        background: var(--muted);
      }
      .quadrant-card.q-do .quadrant-dot {
        background: var(--urgent);
      }
      .quadrant-card.q-plan .quadrant-dot {
        background: var(--important);
      }
      .quadrant-card.q-delegate .quadrant-dot {
        background: var(--butter-ink);
      }
      .quadrant-card.q-later .quadrant-dot {
        background: var(--leaf-ink);
      }
      .quadrant-content {
        min-width: 0;
        display: grid;
        grid-template-rows: auto auto auto;
        align-content: center;
      }
      .quadrant-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        min-height: 22px;
      }
      .quadrant-name {
        font-weight: 800;
        line-height: 1.2;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: "Baloo 2", "PingFang SC", sans-serif;
      }
      .quadrant-action {
        flex: 0 0 auto;
        border-radius: var(--radius-pill);
        padding: 2px 10px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
        line-height: 1.35;
        align-self: center;
      }
      .quadrant-count {
        color: var(--ink);
        font-size: 12px;
        margin-top: 8px;
        font-weight: 800;
        line-height: 1.25;
      }
      .quadrant-rule {
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .id-cell {
        width: 44px;
        color: var(--muted);
      }
      .title-cell {
        width: 24%;
      }
      .status-cell {
        width: 92px;
      }
      .priority-cell {
        width: 92px;
      }
      .date-cell {
        width: 138px;
      }
      .quadrant-cell {
        width: 104px;
      }
      .project-cell {
        width: 12%;
      }
      .tags-cell {
        width: 15%;
      }
      .notes-cell {
        width: 22%;
      }
      .actions-cell {
        width: 92px;
      }
      .empty {
        padding: 48px 42px 56px;
        text-align: center;
        color: var(--muted);
        font-weight: 700;
      }
      .empty::before {
        content: "🏝️";
        display: block;
        font-size: 46px;
        margin-bottom: 12px;
        animation: leaf-sway 3.6s ease-in-out infinite;
        transform-origin: bottom center;
      }
      .chat {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        max-height: calc(100vh - 94px);
      }
      .chat-head {
        padding: 14px;
        border-bottom: 2px dashed var(--line);
        background: linear-gradient(180deg, var(--accent-soft), transparent);
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .chat-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 800;
        font-family: "Baloo 2", "PingFang SC", sans-serif;
        color: var(--accent-ink);
      }
      .quick {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
        gap: 8px;
        padding: 12px;
        border-bottom: 2px dashed var(--line);
      }
      .quick button {
        min-width: 0;
        white-space: nowrap;
        height: 32px;
        font-size: 13px;
      }
      .messages {
        overflow: auto;
        padding: 14px;
        background: var(--soft);
      }
      .msg {
        margin-bottom: 12px;
        padding: 11px 13px;
        border-radius: 16px;
        white-space: pre-wrap;
      }
      .user {
        background: var(--accent);
        color: #fff;
        margin-left: 28px;
        border-bottom-right-radius: 6px;
      }
      .assistant {
        background: #fff;
        border: 1.5px solid var(--line);
        margin-right: 18px;
        border-bottom-left-radius: 6px;
      }
      .assistant.typing {
        white-space: pre-wrap;
      }
      .assistant.typing::after {
        content: "";
        display: inline-block;
        width: 7px;
        height: 14px;
        margin-left: 2px;

    <script>
      const $ = (id) => document.getElementById(id);
      const fields = ["title", "status", "priority", "plan_date", "project", "tags", "notes"];
      const quadrantMeta = {
        do: { name: "重要且紧急", hint: "马上处理", className: "q-do" },
        plan: { name: "重要不紧急", hint: "安排时间", className: "q-plan" },
        delegate: { name: "紧急不重要", hint: "压缩处理", className: "q-delegate" },
        later: { name: "不重要不紧急", hint: "稍后再看", className: "q-later" },
      };
      let tasks = [];
      let chatHistory = [];
      let generatedTasks = [];
      let activeQuadrant = "";
      let sortState = { field: "", direction: "asc" };
      const selectedIds = new Set();

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderMarkdown(markdown) {
        const lines = String(markdown || "").split("\n");
        const html = [];
        let listType = "";
        const closeList = () => {
          if (listType) {
            html.push(`</${listType}>`);
            listType = "";
          }
        };
        const inline = (text) => {
          const codeSpans = [];
          let safe = escapeHtml(text).replace(/`([^`]+)`/g, (_, code) => {
            codeSpans.push(`<code>${code}</code>`);
            return `@@CODE_${codeSpans.length - 1}@@`;
          });
          safe = safe
            .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/__([^_]+)__/g, "<strong>$1</strong>")
            .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
          return safe.replace(/@@CODE_(\d+)@@/g, (_, index) => codeSpans[Number(index)] || "");
        };
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) {
            closeList();
            continue;
          }
          if (trimmed.startsWith("### ")) {
            closeList();
            html.push(`<h3>${inline(trimmed.slice(4))}</h3>`);
          } else if (trimmed.startsWith("## ")) {
            closeList();
            html.push(`<h2>${inline(trimmed.slice(3))}</h2>`);
          } else if (trimmed.startsWith("# ")) {
            closeList();
            html.push(`<h1>${inline(trimmed.slice(2))}</h1>`);
          } else if (/^\d+\.\s+/.test(trimmed)) {
            if (listType !== "ol") {
              closeList();
              listType = "ol";
              html.push("<ol>");
            }
            html.push(`<li>${inline(trimmed.replace(/^\d+\.\s+/, ""))}</li>`);
          } else if (/^[-*]\s+/.test(trimmed)) {
            if (listType !== "ul") {
              closeList();
              listType = "ul";
              html.push("<ul>");
            }
            html.push(`<li>${inline(trimmed.replace(/^[-*]\s+/, ""))}</li>`);
          } else {
            closeList();
            html.push(`<p>${inline(trimmed)}</p>`);
          }
        }
        closeList();
        return html.join("");
      }

      async function jsonFetch(url, options = {}) {
        const resp = await fetch(url, {
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
          ...options,
        });
        const text = await resp.text();
        let data = {};
        if (text) {
          try {
            data = JSON.parse(text);
          } catch {
            data = { detail: text };
          }
        }
        if (!resp.ok) throw new Error(data.detail || "请求失败");
        return data;
      }

      async function ensureAuthenticated() {
        const status = await jsonFetch("/api/auth/status");
        if (!status.enabled || status.authenticated) {
          $("authScreen").hidden = true;
          $("appShell").hidden = false;
          await loadTasks();
          return;
        }
        $("appShell").hidden = true;
        $("authScreen").hidden = false;
        $("accessTokenInput").focus();
      }

      function setTableStatus(text, error = false) {
        $("tableStatus").textContent = text;
        $("tableStatus").className = error ? "board-summary status error" : "board-summary";
      }

      function todayString() {
        return new Date().toISOString().slice(0, 10);
      }

      function addDays(value, days) {
        const date = new Date(`${value}T00:00:00`);
        date.setDate(date.getDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function startOfWeek(value) {
        const date = new Date(`${value}T00:00:00`);
        const day = date.getDay() || 7;
        date.setDate(date.getDate() - day + 1);
        return date.toISOString().slice(0, 10);
      }

      function endOfWeek(value) {
        return addDays(startOfWeek(value), 6);
      }

      function isUrgent(task) {
        return task.plan_date && task.plan_date <= addDays(todayString(), 3);
      }

      function isImportant(task) {
        return task.priority === "高";
      }

      function quadrantKey(task) {
        const important = isImportant(task);
        const urgent = isUrgent(task);
        if (important && urgent) return "do";
        if (important) return "plan";
        if (urgent) return "delegate";
        return "later";
      }

      function priorityClass(priority) {
        if (priority === "高") return "priority-high";
        if (priority === "低") return "priority-low";
        return "priority-medium";
      }

      function priorityPillClass(priority) {
        if (priority === "高") return "p-high";
        if (priority === "低") return "p-low";
        return "p-medium";
      }

      function sortValue(task, field) {
        if (field === "id") return task.id;
        if (field === "status") return { 进行中: 0, 待办: 1, 阻塞: 2, 完成: 3 }[task.status] ?? 9;
        if (field === "priority") return { 高: 0, 中: 1, 低: 2 }[task.priority] ?? 9;
        if (field === "plan_date") return task.plan_date || "9999-12-31";
        return String(task[field] || "").toLowerCase();
      }

      function sortedTasks(rows) {
        if (!sortState.field) return rows;
        const direction = sortState.direction === "asc" ? 1 : -1;
        return [...rows].sort((a, b) => {
          const left = sortValue(a, sortState.field);
          const right = sortValue(b, sortState.field);
          if (left < right) return -1 * direction;
          if (left > right) return 1 * direction;
          return (b.id - a.id) * direction;
        });
      }

      function dateMatchesFilter(task, filter) {
        if (!filter) return true;
        const today = todayString();
        const planDate = task.plan_date || "";
        if (filter === "none") return !planDate;
        if (!planDate) return false;
        if (filter === "overdue") return planDate < today;
        if (filter === "today") return planDate === today;
        if (filter === "week") return planDate >= startOfWeek(today) && planDate <= endOfWeek(today);
        if (filter === "next7") return planDate > today && planDate <= addDays(today, 7);
        return true;
      }

      function renderProjectFilterOptions() {
        const current = $("projectFilter").value;
        const projects = [...new Set(tasks.map((task) => task.project.trim()).filter(Boolean))].sort((a, b) =>

      function filteredTasks() {
        const q = $("search").value.trim().toLowerCase();
        const status = $("statusFilter").value;
        const priority = $("priorityFilter").value;
        const dateFilter = $("dateFilter").value;
        const project = $("projectFilter").value;
        const archive = $("archiveFilter").value;
        const rows = tasks.filter((task) => {
          const hay = `${task.title} ${task.project} ${task.tags} ${task.notes}`.toLowerCase();
          const archiveMatch =
            archive === "all" || (archive === "done" ? task.status === "完成" : task.status !== "完成");
          return (
            archiveMatch &&
            (!q || hay.includes(q)) &&
            (!status || task.status === status) &&
            (!priority || task.priority === priority) &&
            (!project || task.project === project) &&
            dateMatchesFilter(task, dateFilter) &&
            (!activeQuadrant || quadrantKey(task) === activeQuadrant)
          );
        });
        return sortedTasks(rows);
      }

      // === Resizable AI assistant panel ===
      (function setupChatResizer() {
        const layout = document.querySelector(".layout");
        const resizer = $("chatResizer");
        if (!layout || !resizer) return;
        const MIN = 320;
        const MAX = 720;
        const STORE_KEY = "chatWidth";

        const clamp = (px) => Math.max(MIN, Math.min(MAX, px));
        const apply = (px) => {
          layout.style.setProperty("--chat-w", `${px}px`);
        };

        const saved = Number(localStorage.getItem(STORE_KEY));
        if (saved) apply(clamp(saved));

        const widthFromClientX = (clientX) => {
          // chat sits on the right; its width = layout right edge - pointer x
          const right = layout.getBoundingClientRect().right - 16; // minus padding
          return clamp(right - clientX);
        };

        let dragging = false;
        const onMove = (e) => {
          if (!dragging) return;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          apply(widthFromClientX(clientX));
        };
        const onUp = () => {
          if (!dragging) return;
          dragging = false;
          resizer.classList.remove("dragging");
          document.body.classList.remove("resizing");
          const cur = getComputedStyle(layout).getPropertyValue("--chat-w").trim();
          if (cur) localStorage.setItem(STORE_KEY, parseInt(cur, 10));
        };
        const onDown = (e) => {
          dragging = true;
          resizer.classList.add("dragging");
          document.body.classList.add("resizing");
          e.preventDefault();
        };

        resizer.addEventListener("mousedown", onDown);
        resizer.addEventListener("touchstart", onDown, { passive: false });
        window.addEventListener("mousemove", onMove);
        window.addEventListener("touchmove", onMove, { passive: false });
        window.addEventListener("mouseup", onUp);
        window.addEventListener("touchend", onUp);

        // keyboard: arrow keys nudge width
        resizer.addEventListener("keydown", (e) => {
          const cur = parseInt(getComputedStyle(layout).getPropertyValue("--chat-w"), 10) || layout.querySelector(".chat").offsetWidth;
          if (e.key === "ArrowLeft") {
            apply(clamp(cur + 24));
            localStorage.setItem(STORE_KEY, clamp(cur + 24));
            e.preventDefault();
          } else if (e.key === "ArrowRight") {
            apply(clamp(cur - 24));
            localStorage.setItem(STORE_KEY, clamp(cur - 24));
            e.preventDefault();
          }
        });
      })();

      let typingTimer = null;
      function appendMessage(role, content, animate = false) {
        chatHistory.push({ role, content });
        const node = document.createElement("div");
        node.className = `msg ${role} ${role === "assistant" ? "markdown" : ""}`;
        if (role === "assistant") {
          if (animate) {
            typewriter(node, content);
          } else {
            node.innerHTML = renderMarkdown(content);
          }
        } else {
          node.textContent = content;
        }
        $("messages").appendChild(node);
        $("messages").scrollTop = $("messages").scrollHeight;
      }

      function typewriter(node, content) {
        if (typingTimer) clearInterval(typingTimer);
        const messages = $("messages");
        const stickToBottom = () => {
          messages.scrollTop = messages.scrollHeight;
        };
        // reduced motion: skip the animation entirely
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          node.innerHTML = renderMarkdown(content);
          stickToBottom();
          return;
        }
        node.classList.add("typing");
        let i = 0;
        const chars = Array.from(content);
        // pace: faster for long replies so it never feels slow
        const step = chars.length > 400 ? 3 : chars.length > 160 ? 2 : 1;
        typingTimer = setInterval(() => {
          i = Math.min(i + step, chars.length);
          node.textContent = chars.slice(0, i).join("");
          stickToBottom();
          if (i >= chars.length) {
            clearInterval(typingTimer);
            typingTimer = null;
            node.classList.remove("typing");
            node.innerHTML = renderMarkdown(content);
            stickToBottom();
          }
        }, 18);
      }

                          </div>
                          <div class="status">${escapeHtml(task.project || "无项目")} · ${escapeHtml(task.priority)} · ${escapeHtml(task.plan_date || "无日期")} · ${escapeHtml(task.tags || "无标签")}</div>
                          <div>${escapeHtml(task.notes || "")}</div>
                          ${
                            needs.length
                              ? `<div class="needs-input">AI 不确定：${needs.map((field) => (field === "plan_date" ? "DDL" : field === "project" ? "项目归属" : field)).join("、")}，请补充后再追加。</div>`
                              : ""
                          }
                          <div class="generated-grid">
                            <input list="generatedProjectList" data-gen-field="project" data-gen-index="${index}" placeholder="项目（可选已有或新建）" value="${escapeHtml(task.project || "")}" />
                            <input type="date" data-gen-field="plan_date" data-gen-index="${index}" value="${escapeHtml(task.plan_date || "")}" />
                            <select data-gen-field="priority" data-gen-index="${index}">
                              ${["高", "中", "低"].map((v) => `<option ${task.priority === v ? "selected" : ""}>${v}</option>`).join("")}
                            </select>
                            <select data-gen-field="status" data-gen-index="${index}">
                              ${["待办", "进行中", "阻塞"].map((v) => `<option ${task.status === v ? "selected" : ""}>${v}</option>`).join("")}
                            </select>
                          </div>
                        </div>
                      `;
                    })
                    .join("")}
                </div>`
              : `<div class="generated-empty">没有可追加的生成任务。</div>`
          }
        `;
        $("appendGeneratedBtn").disabled = generatedTasks.length === 0;
      }

      $("runGenerateBtn").addEventListener("click", async () => {
        const prompt = $("generatePrompt").value.trim();
        if (!prompt) {
          $("generateStatus").textContent = "先写一个目标。";
          $("generateStatus").className = "status error";
          return;
        }
        $("runGenerateBtn").disabled = true;
        $("appendGeneratedBtn").disabled = true;
        $("generateStatus").textContent = "生成中...";
        $("generateStatus").className = "status";
        try {
          const data = await jsonFetch("/api/generate", {
            method: "POST",
            body: JSON.stringify({ prompt, horizon: $("generateHorizon").value }),
          });
          generatedTasks = data.tasks || [];
          const skipped = data.skipped || [];
          renderGeneratedTasks(data.summary || "", skipped);
          $("generateStatus").textContent = "预览已生成";
        } catch (err) {
          $("generateStatus").textContent = err.message;
          $("generateStatus").className = "status error";
        } finally {
          $("runGenerateBtn").disabled = false;
        }
      });

      $("generatedResult").addEventListener("input", (event) => {
        const index = Number(event.target.dataset.genIndex);
        const field = event.target.dataset.genField;
        if (!field || Number.isNaN(index) || !generatedTasks[index]) return;
        generatedTasks[index][field] = event.target.value;
        generatedTasks[index].needs_input = (generatedTasks[index].needs_input || []).filter((item) => item !== field);
      });

      $("generatedResult").addEventListener("click", (event) => {
        const button = event.target.closest("[data-delete-generated]");
        if (!button) return;
        const index = Number(button.dataset.deleteGenerated);
        if (Number.isNaN(index) || !generatedTasks[index]) return;
        generatedTasks.splice(index, 1);
        renderGeneratedTasks();
        $("generateStatus").textContent = generatedTasks.length ? "已删除 1 条生成任务" : "生成任务已清空";
        $("generateStatus").className = "status";
      });

      $("appendGeneratedBtn").addEventListener("click", async () => {
        const missing = generatedTasks.filter((task) => {
          const needs = task.needs_input || [];
          return (needs.includes("plan_date") && !task.plan_date) || (needs.includes("project") && !task.project);
        });
        if (missing.length) {
          $("generateStatus").textContent = "还有任务缺少 DDL 或项目归属，请补充后再追加。";
          $("generateStatus").className = "status error";
          return;
        }
        $("appendGeneratedBtn").disabled = true;
        for (const task of generatedTasks) {
          await jsonFetch("/api/tasks", { method: "POST", body: JSON.stringify(task) });
        }
        generatedTasks = [];
        $("generateDialog").close();
        await loadTasks();
      });

      $("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("authStatus").textContent = "正在验证...";
        $("authStatus").className = "status";
        try {
          await jsonFetch("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ access_token: $("accessTokenInput").value }),
          });
          $("accessTokenInput").value = "";
          await ensureAuthenticated();
        } catch (err) {
          $("authStatus").textContent = err.message;
          $("authStatus").className = "status error";
        }
      });

      $("logoutBtn").addEventListener("click", async () => {
        await jsonFetch("/api/auth/logout", { method: "POST", body: "{}" });
        tasks = [];
        selectedIds.clear();
        $("appShell").hidden = true;
        $("authScreen").hidden = false;
        $("accessTokenInput").focus();
      });

      ensureAuthenticated().catch((err) => {
        $("authScreen").hidden = false;
        $("authStatus").textContent = err.message;
        $("authStatus").className = "status error";
      });
    </script>
  </body>
</html>
